server {
    listen 10000;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    # CORS – cho phép origin thực tế hoặc tất cả
    #add_header 'Access-Control-Allow-Origin' 'https://tttn-1.onrender.com' always;
    #add_header 'Access-Control-Allow-Origin' 'https://tttn-2.onrender.com' always;
    add_header 'Access-Control-Allow-Origin' '*' always;

    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    # Example of a dynamic origin map (uncomment to use instead of wildcard):
    #
    # map $http_origin $cors_origin {
    #     default "";
    #     "https://tttn-1.onrender.com" $http_origin;
    #     "https://tttn-2.onrender.com" $http_origin;
    # }
    # add_header 'Access-Control-Allow-Origin' $cors_origin always;

    # Handle preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    # MIME types (tránh browser chặn CSS)
    include /etc/nginx/mime.types;

    # Serve static files (except Swagger assets which are served by Laravel)
    # exclude the /docs/asset directory so requests go through the normal Laravel route.
    location ~* ^/(?!docs/asset/).*\.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|map)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ^~ /vendor/ {
    root /var/www/public;
    try_files $uri =404;
    access_log off;
    expires 30d;
    }
}